<html lang="de">

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>KI-Assistent – PhysioPro Lübeck</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', -apple-system, sans-serif;
    background: #faf9f7;
    height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
  }
  .qa-header {
    background: #2d4a3e; color: #fff;
    padding: 16px 20px 14px;
    display: flex; align-items: center; gap: 12px; flex-shrink: 0;
  }
  .qa-header-icon {
    width: 38px; height: 38px;
    background: rgba(255,255,255,0.15); border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 18px;
  }
  .qa-header-text h3 { font-size: 15px; font-weight: 600; letter-spacing: -0.2px; }
  .qa-header-text p { font-size: 12px; opacity: 0.7; margin-top: 1px; }
  .qa-status { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12px; opacity: 0.8; }
  .qa-close { margin-left: 12px; width: 30px; height: 30px; flex-shrink: 0; border: none; cursor: pointer;
    background: rgba(255,255,255,0.15); border-radius: 50%; color: #fff; font-size: 16px; line-height: 1;
    display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
  .qa-close:hover { background: rgba(255,255,255,0.3); }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #7ecba1; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .qa-messages {
    flex: 1; overflow-y: auto; padding: 16px 14px;
    display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth;
  }
  .msg {
    max-width: 87%; padding: 11px 14px; border-radius: 14px;
    font-size: 14px; line-height: 1.6; animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn { from{opacity:0;transform:translateY(4px)} to{opacity:1} }
  .msg-bot {
    background: #fff; border: 1px solid #e8e4df;
    border-bottom-left-radius: 4px; align-self: flex-start; color: #2a2a2a;
  }
  .msg-user {
    background: #2d4a3e; color: #fff;
    border-bottom-right-radius: 4px; align-self: flex-end;
  }
  .typing {
    display: flex; gap: 4px; padding: 14px 16px;
    background: #fff; border: 1px solid #e8e4df;
    border-radius: 14px; border-bottom-left-radius: 4px; align-self: flex-start;
  }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%; background: #aaa;
    animation: bounce 1.2s infinite;
  }
  .typing span:nth-child(2){animation-delay:.2s} .typing span:nth-child(3){animation-delay:.4s}
  @keyframes bounce { 0%,80%,100%{transform:translateY(0);opacity:.4} 40%{transform:translateY(-6px);opacity:1} }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 2px 14px 8px; }
  .chip {
    background: #fff; border: 1px solid #ccc6be; border-radius: 20px;
    padding: 6px 13px; font-size: 13px; color: #2d4a3e;
    cursor: pointer; font-family: inherit; transition: all 0.15s; white-space: nowrap;
  }
  .chip:hover { background: #2d4a3e; color: #fff; border-color: #2d4a3e; }
  .qa-input-row {
    padding: 10px 14px 14px; display: flex; gap: 8px; flex-shrink: 0;
    background: #faf9f7; border-top: 1px solid #ebe7e2;
    position: sticky; bottom: 0;
  }
  .qa-input {
    flex: 1; border: 1px solid #ccc6be; border-radius: 22px;
    padding: 10px 16px; font-size: 14px; font-family: inherit;
    background: #fff; outline: none; color: #2a2a2a; height: 42px;
    transition: border-color .15s;
  }
  .qa-input:focus { border-color: #2d4a3e; }
  .qa-send {
    width: 42px; height: 42px; background: #2d4a3e; border: none;
    border-radius: 50%; cursor: pointer; display: flex; align-items: center;
    justify-content: center; flex-shrink: 0; transition: background .15s;
  }
  .qa-send:hover { background: #3a5f51; }
  .qa-send svg { width: 18px; height: 18px; fill: #fff; }
  .qa-send:disabled { opacity: 0.4; cursor: default; }
  .cta-row { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .hint {
    margin-top: 8px; padding-top: 8px;
    border-top: 1px solid #f0ece8;
    font-size: 12px; color: #888;
  }
  .hint a { color: #2d4a3e; text-decoration: none; font-weight: 500; }
  .hint a:hover { text-decoration: underline; }
  .cta-btn {
    background: #2d4a3e; color: #fff; border: none; border-radius: 8px;
    padding: 8px 14px; font-size: 13px; cursor: pointer; font-family: inherit;
    text-decoration: none; display: inline-block; transition: background .15s;
  }
  .cta-btn.outline {
    background: transparent; color: #2d4a3e; border: 1.5px solid #2d4a3e;
  }
</style>

<body>
<div class="qa-header">
  <div class="qa-header-icon">🌿</div>
  <div class="qa-header-text">
    <h3>KI-Assistent PhysioPro</h3>
    <p>Frag mich alles zu PhysioPro Lübeck</p>
  </div>
  <div class="qa-status">
    <div class="status-dot"></div>
    Online
  </div>
  <button class="qa-close" aria-label="Schließen" onclick="window.parent.postMessage('close-qa','*')">✕</button>
</div>
<div class="qa-messages" id="msgs"></div>
<div class="chips" id="chips"></div>
<div class="qa-input-row">
  <input class="qa-input" id="inp" type="text" placeholder="Deine Frage …" autocomplete="off">
  <button class="qa-send" id="sendBtn">
    <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
  </button>
</div>

<script>
const SYSTEM = `Du bist der KI-Assistent von PhysioPro Lübeck. Deine Aufgabe ist es, Fragen rund um Gesundheit, Körper und Wohlbefinden ehrlich und kompetent zu beantworten – und dabei immer zu begründen, warum PhysioPro Lübeck für das jeweilige Anliegen die richtige Adresse ist, sofern das ehrlich zutrifft.

WICHTIGE GRUNDREGELN:
1. Bei medizinischen Notfällen (starke Brustschmerzen, Schlaganfall-Symptome, starke Atemnot, schwere Verletzungen) weise IMMER zuerst auf den Notruf 112 hin. Empfehle PhysioPro erst nach der akuten Phase zur Rehabilitation.
2. Bei Anliegen die klar außerhalb des Leistungsspektrums liegen (z.B. Psychotherapie, Zahnmedizin, Augenprobleme) empfehle den passenden Fachbereich – und erkläre dann, ob und wie PhysioPro ergänzend helfen kann.
3. Begründe immer konkret warum PhysioPro für das Anliegen geeignet ist – nenne die spezifische Behandlung, den Therapeuten oder den Vorteil. Keine leeren Werbeaussagen.
4. Antworte auf Deutsch, freundlich und auf Augenhöhe. Max. 4 Sätze. Keine Emojis.

ÜBER PHYSIOPRO LÜBECK:
Gründerin: Hanna Wrobel (22 Jahre Erfahrung). Adresse: Segeberger Str. 1, 23617 Stockelsdorf bei Lübeck. Parkplätze direkt am Haus. Tel: 0451 / 400 730 73. E-Mail: info@physioproluebeck.de. Öffnungszeiten: Mo–Do 8–20 Uhr, Fr 8–14 Uhr. Online-Terminbuchung möglich, auch ohne ärztliche Verordnung.

LEISTUNGEN:
1. Physiotherapie – Schmerzen, Verletzungen, Bewegungseinschränkungen, Rücken, Gelenke, post-operative Reha. Inkl. Krankengymnastik am Pilates-Reformer.
2. Osteopathie – ganzheitliche manuelle Therapie bei Julia Mielke. Ohne Verordnung buchbar. Krankenkassen bezuschussen häufig. Osteopathie-Check: 20 Min. für 26,50 € als Orientierungsgespräch. Indikationen: Rückenschmerzen, Gelenkbeschwerden, Migräne, Kieferschmerzen, Stress, Verdauungsprobleme, Schlafprobleme.
3. Heilpraktik – Naturheilkunde und Gesundheitscoaching (Julia Mielke).
4. Manuelle Lymphdrainage – bei Schwellungen, Ödemen, nach Operationen oder Krebstherapie.
5. Massage – Verspannungen, Durchblutungsförderung, Entspannung, Prävention.
6. Manuelle Therapie – Mobilisation von Gelenken, Blockaden lösen.
7. Pilates – Reformer, Matte, Flying, Yoga (über Pilates Company Lübeck, Buchung via Eversports).

TEAM: Hanna Wrobel (Gründerin, Physiotherapeutin & Pilatestrainerin, WhatsApp +49 176 2333 9367), Julia Mielke (Osteopathin, Heilpraktikerin, Physiotherapeutin), Anna (Physiotherapeutin), Tuana (Physiotherapeutin & Pilatestrainerin), Maike (Physiotherapeutin & Pilatestrainerin), Annika (Front Office, ausgebildete Physio), Phillip (Physiotherapeut), Imo (Physiotherapeutin).

JOBS: Physiotherapeut:innen gesucht (m/w/d), Voll- oder Teilzeit. Gehalt 3.500–5.500 € brutto/Monat. Benefits: iPad, Fortbildung, Dienstwagen auf Wunsch, kostenloser Pilates-Zugang, Hilfe bei Wohnungssuche, Führungsperspektive. Kein Anschreiben nötig – direkt per WhatsApp an Hanna (+49 176 2333 9367).

TERMIN: Online buchbar unter physioproluebeck.de/termin. Rückruf anfordern über Kontaktformular. Tel: 0451 / 400 730 73.

BEGRÜNDUNGS-BEISPIELE (verwende dieses Muster):
- Rückenschmerzen → "Physiotherapie ist hier die erste Wahl, weil wir gezielt die Ursache – z.B. Muskeldysbalancen oder Blockaden – behandeln. Unser Team arbeitet mit manueller Therapie und Übungen am Reformer. Einen Termin können Sie ohne Verordnung buchen."
- Migräne → "Osteopathie kann bei Migräne sehr wirksam sein, weil Spannungen im Kiefer- und Nackenbereich häufige Auslöser sind – das ist genau Julia Mielkes Fachgebiet. Der Osteopathie-Check für 26,50 € ist ein guter erster Schritt."
- Notfall → "Bei akuten starken Brustschmerzen rufen Sie bitte sofort den Notruf 112 an. Wenn Sie danach eine Reha oder Unterstützung beim Wiederaufbau benötigen, sind wir die richtige Adresse."`;

const msgs = document.getElementById('msgs');
const inp = document.getElementById('inp');
const sendBtn = document.getElementById('sendBtn');
const chipsEl = document.getElementById('chips');
let history = [];
let exchangeCount = 0;

const STARTER_CHIPS = [
  'Rücken, Gelenke oder Sportverletzung – was hilft?',
  'Stress, Kiefer oder Kopfschmerzen – was steckt dahinter?',
  'Wechseljahre & Hormone – was kann Physiotherapie tun?',
  'Termin buchen',
  'Öffnungszeiten',
  'Offene Stellen'
];

function addMsg(html, isUser) {
  const el = document.createElement('div');
  el.className = 'msg ' + (isUser ? 'msg-user' : 'msg-bot');
  el.innerHTML = html;
  msgs.appendChild(el);
  msgs.scrollTop = msgs.scrollHeight;
  return el;
}
function showTyping() {
  const el = document.createElement('div');
  el.className = 'typing'; el.id = 'typing';
  el.innerHTML = '<span></span><span></span><span></span>';
  msgs.appendChild(el); msgs.scrollTop = msgs.scrollHeight;
}
function hideTyping() { const e = document.getElementById('typing'); if(e) e.remove(); }
function setChips(arr) {
  chipsEl.innerHTML = '';
  arr.forEach(label => {
    const btn = document.createElement('button');
    btn.className = 'chip'; btn.textContent = label;
    btn.onclick = () => { inp.value = label; send(); };
    chipsEl.appendChild(btn);
  });
}

async function send() {
  const text = inp.value.trim();
  if (!text || sendBtn.disabled) return;
  inp.value = ''; setChips([]); sendBtn.disabled = true;
  addMsg(text, true);
  history.push({ role: 'user', content: text });
  showTyping();

  try {
    const res = await fetch('/.netlify/functions/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history, system: SYSTEM })
    });
    const data = await res.json();
    hideTyping();
    const reply = data.reply || 'Entschuldigung, ich konnte Ihre Frage nicht beantworten.';
    history.push({ role: 'assistant', content: reply });
    exchangeCount++;

    const replyHtml = reply.replace(/\n/g, '<br>');
    addMsg(replyHtml + '<div class="hint"><a href="/termin" target="_parent">Termin buchen</a> · <a href="tel:04514007307" target="_parent">0451 / 400 730 73</a></div>', false);

    if (exchangeCount >= 6) {
      const ctaEl = document.createElement('div');
      ctaEl.className = 'msg msg-bot';
      ctaEl.innerHTML = 'Sie haben einige Fragen gestellt – am besten besprechen wir Ihr Anliegen persönlich. Darf unser Team Sie kurz zurückrufen?<div class="cta-row"><a class="cta-btn" href="/kontakt" target="_parent">Rückruf anfordern</a><a class="cta-btn outline" href="tel:04514007307" target="_parent">Jetzt anrufen</a></div>';
      msgs.appendChild(ctaEl); msgs.scrollTop = msgs.scrollHeight;
      exchangeCount = 0;
    } else {
      const l = text.toLowerCase();
      if (l.match(/rücken|nacken|schulter|knie|hüfte|gelenk|sport|verletzung|lymph/))
        setChips(['Termin ohne Verordnung buchen', 'Auch ohne Rezept möglich?', 'Pilates Reformer – was ist das?']);
      else if (l.match(/stress|kiefer|kopf|migräne|osteo|check|erschöpf|verdauung|chronisch|bildschirm/))
        setChips(['Osteopathie-Check buchen · 26,50 €', 'Übernimmt die Kasse das?', 'Wer ist Julia Mielke?']);
      else if (l.match(/wechsel|hormon|beckenboden|menopause|schlaf|frau|40|she regulates/))
        setChips(['Termin bei Hanna buchen', 'Was ist She Regulates?', 'Welche Behandlungen helfen?']);
      else if (l.match(/termin|buch|wann|öffnung/))
        setChips(['Online buchen', 'Ohne Verordnung?', 'Rückruf anfordern']);
      else if (l.match(/job|stell|bewer|gehalt/))
        setChips(['Gehalt & Benefits', 'Teilzeit möglich?', 'Per WhatsApp bewerben']);
      else
        setChips(['Termin buchen', 'Öffnungszeiten', 'Noch eine Frage']);
    }
  } catch(e) {
    hideTyping();
    addMsg('Ein Fehler ist aufgetreten. Bitte rufen Sie uns an: <strong>0451 / 400 730 73</strong>', false);
  }
  sendBtn.disabled = false; inp.focus();
}

inp.addEventListener('keydown', e => { if(e.key === 'Enter') { e.preventDefault(); send(); } });
inp.addEventListener('keyup', e => { if(e.key === 'Enter') send(); });
window.onload = () => {
  addMsg('Guten Tag! Womit kann ich Ihnen helfen? Wählen Sie ein Thema oder stellen Sie direkt Ihre Frage – ich erkläre Ihnen, was bei Ihrem Anliegen hilft und warum PhysioPro dafür die richtige Adresse ist.', false);
  setChips(STARTER_CHIPS);
};
</script>
</body>
</html>
