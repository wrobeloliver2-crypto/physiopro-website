[build]
  publish = "."

[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

[functions]
  directory = "netlify/functions"

# HTML-Seiten nie aggressiv cachen – verhindert veraltete Seiten nach Updates
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Statische Assets: immer beim Server nachfragen (ETag-basiert), damit Kunden
# Änderungen sofort sehen statt bis zu ein Jahr lang eine alte, gecachte
# Version zu behalten. Netlify liefert bei unveraenderten Dateien ein
# schnelles "304 Not Modified" zurueck (kein erneuter Download).
[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "*.webp"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "*.svg"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── Ergaenzt 13.08.2026: 301-Redirects (Alt-URLs / .html-Varianten) ──
[[redirects]]
  from = "/online-termine"
  to = "/termin"
  status = 301

[[redirects]]
  from = "/impressum.html"
  to = "/impressum"
  status = 301
  force = true

[[redirects]]
  from = "/datenschutz.html"
  to = "/datenschutz"
  status = 301
  force = true
