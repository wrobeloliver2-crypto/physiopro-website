[build]
  publish = "."

[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

[functions]
  directory = "netlify/functions"

# Taegliche Kruse-Zusammenfassung: 17 Uhr deutsche Sommerzeit = 15 UTC.
# ACHTUNG bei Umstellung auf Winterzeit (MEZ, ab Oktober): auf 16 UTC anpassen!
[functions."kruse-daily-summary"]
  schedule = "0 15 * * *"

# HTML-Seiten nie aggressiv cachen – verhindert veraltete Seiten nach Updates
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Statische Assets dürfen lange gecacht werden
[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
