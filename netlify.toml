[build]
  publish = "."

[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

[functions]
  directory = "netlify/functions"

# Taegliche Kruse-Zusammenfassung: 17 Uhr deutsche Sommerzeit = 15 UTC.
# ACHTUNG bei Umstellung auf Winterzeit (MEZ, ab Oktober): auf 16 UTC anpassen!
[functions."kruse-daily-summary"]
  schedule = "0 15 * * *"

# HTML-Seiten nie aggressiv cachen – verhindert veraltete Seiten nach Updates
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Statische Assets: immer beim Server nachfragen (ETag-basiert), damit Kunden
# Änderungen sofort sehen statt bis zu ein Jahr lang eine alte, gecachte
# Version zu behalten. Netlify liefert bei unveraenderten Dateien ein
# schnelles "304 Not Modified" zurueck (kein erneuter Download).
[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "*.webp"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "*.svg"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
